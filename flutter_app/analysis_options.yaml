# PsychSwitch Flutter — strict analysis config.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Freezed's @JsonKey(fromJson:, toJson:) on factory parameters is the
    # standard pattern; the analyzer flags it as invalid_annotation_target
    # but the codegen handles it correctly. Suppress the false positive.
    invalid_annotation_target: ignore

linter:
  rules:
    require_trailing_commas: true
    public_member_api_docs: false
    sort_pub_dependencies: false
    # Freezed's union-style required-after-optional ordering is fine
    # when annotations differ.
    always_put_required_named_parameters_first: false
