name: psychswitch
description: "PsychSwitch — clinical decision-support for psychotropic cross-titration. Built for Malaysian psychiatrists."
publish_to: 'none'

# Mirrors the version in /app.json for the existing React Native build.
# Flutter v0.5.0 starts after Phase 8 cutover; until then both branches
# co-exist. Build number auto-increments per release.
version: 0.5.0-alpha.0+1

environment:
  sdk: ^3.7.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Engine (extracted to a pure-Dart package in Phase 6) ──────────
  # Lets the upcoming Dart MCP server consume the same engine without
  # having to drag in Flutter SDK.
  psychswitch_engine:
    path: ../psychswitch_engine

  # ── State ──────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  # riverpod_annotation deferred — its codegen helper
  # (riverpod_generator) pulls in custom_lint_core / analyzer_plugin
  # 0.12 which conflicts with analyzer 7.6 on current Dart SDK. Hand-
  # written providers (Provider, NotifierProvider, AsyncNotifierProvider)
  # are slightly more verbose but work fine. Re-add when ecosystem
  # catches up.

  # ── Routing ────────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Storage ────────────────────────────────────────────────────────
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # ── HTTP (reserved; no current network calls) ──────────────────────
  dio: ^5.7.0

  # ── PDF / share / print ────────────────────────────────────────────
  printing: ^5.13.4
  pdf: ^3.11.1
  share_plus: ^10.1.2

  # ── SVG / markdown ─────────────────────────────────────────────────
  flutter_svg: ^2.0.16
  flutter_markdown: ^0.7.4+3

  # ── Notifications + haptics ────────────────────────────────────────
  flutter_local_notifications: ^18.0.1
  haptic_feedback: ^0.5.1+1

  # ── Crash reporting ────────────────────────────────────────────────
  sentry_flutter: ^9.20.0

  # ── Localization (BM lands post-migration) ─────────────────────────
  intl: ^0.20.2

  # ── Codegen runtime support ────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── App metadata access ────────────────────────────────────────────
  package_info_plus: ^8.1.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ── Lints ──────────────────────────────────────────────────────────
  very_good_analysis: ^7.0.0

  # ── Codegen ────────────────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.21.0
  # riverpod_generator + riverpod_lint + custom_lint deferred —
  # see note in dependencies block above.

  # ── Testing ────────────────────────────────────────────────────────
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0

  # ── Asset pipeline ─────────────────────────────────────────────────
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true # for l10n codegen

  assets:
    - assets/

# ── Launcher icons (run: dart run flutter_launcher_icons) ─────────────
# Source: assets/icon.png (1024×1024 PsychSwitch brand mark — two
# crossing taper curves over the from→to palette).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon.png'
  # Adaptive (Android 8+): solid bg matches the app surface so the
  # cross fades naturally onto launchers; foreground crops the same
  # mark with the 66% safe zone the SVG was designed against.
  adaptive_icon_background: '#0B0F14'
  adaptive_icon_foreground: 'assets/icon.png'
  remove_alpha_ios: true
  min_sdk_android: 21

# ── Native splash (run: dart run flutter_native_splash:create) ────────
# Paints the dark surface + brand mark before Flutter boots. Eliminates
# the white flash on cold-start. The Flutter EngineLoadingView takes
# over once main() resolves.
flutter_native_splash:
  color: '#0B0F14'
  image: 'assets/icon.png'
  android_12:
    color: '#0B0F14'
    image: 'assets/icon.png'
    icon_background_color: '#0B0F14'
  android: true
  ios: true
  fullscreen: false
